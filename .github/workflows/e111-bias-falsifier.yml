name: E111 exact angular bias falsifier

on:
  push:
    branches:
      - research/e111-late4-gaussian-relu-plugin-cost-20260919
    paths:
      - '.github/workflows/e111-bias-falsifier.yml'

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  falsifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen project dependencies
        run: python -m pip install -e .
      - name: Run exactly one frozen E111 target-free bias falsifier
        run: python scripts/e111_bias_falsifier.py
      - name: Upload immutable E111 bias evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e111-bias-falsifier
          path: e111-bias-falsifier.json
          if-no-files-found: error
          retention-days: 90

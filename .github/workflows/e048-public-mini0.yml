name: E048 frozen public mini0

on:
  push:
    branches:
      - research/e048-source-free-response-recurrence-20260916
    paths:
      - .github/workflows/e048-public-mini0.yml

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    env:
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen dependencies
        run: python -m pip install -e .
      - name: Run exactly one frozen E048 mini0 diagnostic
        run: /usr/bin/time -v python scripts/e048_public_mini0_diagnostic.py 2>&1 | tee e048-public-mini0.log
      - name: Upload immutable diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e048-public-mini0-log
          path: e048-public-mini0.log
          if-no-files-found: error
          retention-days: 30

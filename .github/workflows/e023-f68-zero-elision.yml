name: E023 F68 zero-elision diagnostic

on:
  push:
    branches:
      - research/e023-f68-zero-elision-20250915

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install -e . pytest numpy scipy pyarrow huggingface_hub
      - name: Focused E023 tests
        run: pytest -q tests/test_e023_f68_zero_elision.py
      - name: Frozen E023 diagnostic
        run: python scripts/run_e023_f68_zero_elision.py

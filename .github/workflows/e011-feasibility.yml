name: e011-hk-feasibility

on:
  push:
    branches: [research/e011-hk-rectangular-diagnostic]
  workflow_dispatch:

jobs:
  feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and focused test tools
        run: python -m pip install -e . ruff pytest
      - name: Lint focused E011 files
        run: ruff check methods/hk_rectangular.py scripts/e011_hk_feasibility.py tests/test_hk_rectangular.py
      - name: Focused unit tests
        run: pytest -q tests/test_hk_rectangular.py
      - name: Fetch pinned verified Hopcroft-Kerr scheme
        shell: bash
        run: |
          set -euo pipefail
          url='https://raw.githubusercontent.com/solven-eu/matmulcatalog/f3a7f0f61b1005666c2cb03f98f2a16727604ea0/src/main/resources/schemes/constructed/section16/2x16x16-r392-hk71-63c5683.json'
          curl -fsSL "$url" -o /tmp/e011-hk.json
          got="$(git hash-object /tmp/e011-hk.json)"
          test "$got" = '82d1af82132941726bbe67d2e374f77f6e1031a6'
          echo "verified_git_blob=$got"
      - name: Synthetic cost-only feasibility diagnostic
        run: python scripts/e011_hk_feasibility.py --scheme-json /tmp/e011-hk.json

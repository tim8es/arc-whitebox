name: E044 fixed-checkpoint K3 replay

on:
  push:
    branches:
      - research/e044-fixed-checkpoint-k3-replay-20260916
    paths:
      - '.github/workflows/e044-fixed-checkpoint-k3-replay.yml'

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen dependencies
        run: python -m pip install -e . pytest numpy pyarrow huggingface_hub
      - name: Focused E044 tests
        run: pytest -q tests/test_e044_fixed_checkpoint_k3_replay.py
      - name: Frozen E044 public-mini index-0 diagnostic
        run: python scripts/run_e044_fixed_checkpoint_k3_replay.py
      - name: Upload frozen E044 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e044-frozen-result
          path: e044_result.json
          if-no-files-found: ignore

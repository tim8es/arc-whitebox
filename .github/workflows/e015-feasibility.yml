name: e015-feasibility

on:
  push:
    branches: [research/e015-mz-prony-memory-20260914]
  workflow_dispatch:

jobs:
  feasibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and test tools
        run: python -m pip install -e . pytest
      - name: E015 focused tests
        run: pytest -q tests/test_e015_mz_prony.py tests/test_e015_instrumentation.py
      - name: Frozen E015 diagnostic
        run: python scripts/e015_mz_diagnostic.py

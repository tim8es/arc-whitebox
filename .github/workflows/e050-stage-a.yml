name: E050 frozen Stage-A

on:
  push:
    branches:
      - research/e050-stable-float64-v29-20260916
    paths:
      - .github/workflows/e050-stage-a.yml

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  stage-a:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frozen dependencies
        run: python -m pip install -e . pytest
      - name: Focused static port/instrumentation tests
        run: pytest -q tests/test_e050_float64_port.py
      - name: Sole bounded Stage-A attempt
        run: |
          mkdir -p artifacts
          python scripts/e050_stage_a.py | tee artifacts/e050-stage-a.log
      - name: Upload Stage-A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e050-stage-a-evidence
          path: |
            artifacts/e050-stage-a.json
            artifacts/e050-stage-a.log
          if-no-files-found: error

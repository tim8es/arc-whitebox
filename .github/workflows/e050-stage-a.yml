name: E050 bounded Stage-A replay

on:
  push:
    branches:
      - research/e050-stable-float64-v29-20260916
    paths:
      - 'methods/e050_float64_v29.py'
      - 'tests/test_e050_float64_v29.py'
      - 'scripts/run_e050_stage_a.py'
      - '.github/workflows/e050-stage-a.yml'

jobs:
  stage-a:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      V26_WARM: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install -e . pytest numpy
      - name: Focused E050 tests
        run: pytest -q tests/test_e050_float64_v29.py
      - name: Frozen E050 Stage-A replay
        run: python scripts/run_e050_stage_a.py
      - name: Upload Stage-A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e050-stage-a
          path: e050_stage_a.json
          if-no-files-found: warn

name: E022 oversampled basis diagnostic

on:
  push:
    branches:
      - research/e022-oversampled-shared-basis-20250915
  workflow_dispatch:

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install -e . pytest numpy scipy
      - name: Focused E022 tests
        run: pytest -q tests/test_e022_oversampled_basis.py
      - name: Frozen E022 diagnostic
        if: success()
        run: python scripts/run_e022_oversampled_basis.py

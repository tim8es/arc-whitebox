name: E091 frozen Phase-2 disjoint transfer

on:
  push:
    branches:
      - research/e091-loo-ridge-readiness-20260916
    paths:
      - 'research/E091_PHASE2_TRANSFER_FREEZE.json'
      - 'scripts/e091_phase2_transfer.py'
      - '.github/workflows/e091-phase2-transfer.yml'

jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen project dependencies
        run: python -m pip install -e .
      - name: Execute exactly one frozen E091 A/B transfer
        shell: bash
        run: |
          set -o pipefail
          python scripts/e091_phase2_transfer.py --output e091-phase2-transfer-result.json 2>&1 | tee e091-phase2-transfer.log
      - name: Upload immutable transfer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e091-phase2-disjoint-transfer
          path: |
            e091-phase2-transfer-result.json
            e091-phase2-transfer.log
          if-no-files-found: warn

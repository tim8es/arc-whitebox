name: e018-preflight

on:
  push:
    branches: [research/e018-importance-old-d21-20260915]
    paths: [.github/workflows/e018-preflight.yml]

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install preflight dependencies
        run: python -m pip install -e . pytest ruff
      - name: Focused tests
        run: pytest -q tests/test_e018_importance_d21.py
      - name: Syntax check
        run: python -m py_compile methods/e018_importance_d21.py scripts/e018_diagnostic.py
      - name: Lint E018 files
        run: ruff check methods/e018_importance_d21.py scripts/e018_diagnostic.py tests/test_e018_importance_d21.py

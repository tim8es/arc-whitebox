name: E043 terminal-adjoint K3

on:
  push:
    branches:
      - research/e043-terminal-adjoint-k3-20260915
    paths:
      - 'tests/test_e043_terminal_adjoint_k3.py'
      - 'methods/e043_terminal_adjoint_k3.py'
      - '.github/workflows/e043-terminal-adjoint-k3.yml'
      - 'research/E043_PROTOCOL.md'

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install -e . pytest
      - name: Focused E043 tests
        run: pytest -q tests/test_e043_terminal_adjoint_k3.py

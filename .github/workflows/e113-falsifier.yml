name: E113 exact conditional-moment falsifier

on:
  push:
    branches:
      - research/e113-top2-gate-conditional-moments-20260919
    paths:
      - '.github/workflows/e113-falsifier.yml'

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  falsifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen project dependencies
        run: python -m pip install -e .
      - name: Run exactly one frozen E113 falsifier
        run: python scripts/e113_falsifier.py
      - name: Upload immutable E113 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e113-falsifier
          path: e113-top2-gate-conditional.json
          if-no-files-found: error
          retention-days: 90

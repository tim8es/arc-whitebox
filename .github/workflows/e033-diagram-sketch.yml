name: E033 global diagram sketch

on:
  push:
    branches:
      - research/e033-source-hutchinson-20260915
    paths:
      - 'tests/test_e033_diagram_sketch.py'
      - 'methods/e033_diagram_sketch.py'
      - 'scripts/run_e033_diagram_sketch.py'
      - '.github/workflows/e033-diagram-sketch.yml'

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: python -m pip install -e . pytest numpy pyarrow huggingface_hub
      - name: Focused E033 tests
        run: pytest -q tests/test_e033_diagram_sketch.py
      - name: Install frozen dense-oracle dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          python -m pip install scipy einops jaxtyping quimb joblib
          git clone --filter=blob:none --no-checkout https://github.com/alignment-research-center/mlp_cumulant_propagation.git /tmp/mlp_cumulant_propagation
          git -C /tmp/mlp_cumulant_propagation fetch --depth=1 origin 93d091a4c26c042bfffa28f2e76a81bc0aba94bb
          git -C /tmp/mlp_cumulant_propagation checkout --detach 93d091a4c26c042bfffa28f2e76a81bc0aba94bb
          echo "PYTHONPATH=/tmp/mlp_cumulant_propagation/src:${PYTHONPATH}" >> "$GITHUB_ENV"
      - name: Frozen E033 diagnostic
        run: python scripts/run_e033_diagram_sketch.py

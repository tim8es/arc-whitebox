name: E043 frozen public mini0

on:
  push:
    branches:
      - research/e043-terminal-adjoint-k3-20260915
    paths:
      - '.github/workflows/e043-public-mini0.yml'

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen project dependencies
        run: python -m pip install -e .
      - name: Frozen public Phase-2 mini index 0 diagnostic
        shell: bash
        run: |
          set -o pipefail
          echo 'COMMAND=python scripts/e043_public_mini0_diagnostic.py'
          /usr/bin/time -v python scripts/e043_public_mini0_diagnostic.py 2>&1 | tee e043-public-mini0.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e043-public-mini0-log
          path: e043-public-mini0.log
          if-no-files-found: warn

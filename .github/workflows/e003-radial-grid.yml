name: e003-radial-grid

on:
  pull_request:
    branches:
      - research/bootstrap
    paths:
      - .github/workflows/e003-radial-grid.yml
      - methods/radial_fourth_moment.py
      - experiments/e003_radial_candidate.py
      - research/E003_PROTOCOL.md
      - research/ledger.csv
      - tests/test_radial_fourth_moment.py

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        strength: ["0.25", "0.50", "0.75"]
    env:
      E003_RADIAL_STRENGTH: ${{ matrix.strength }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: python -m pip install -e .

      - name: Validate E003 candidate
        run: whest validate --estimator experiments/e003_radial_candidate.py

      - name: Score E003 candidate on Phase 2 mini
        run: |
          set -o pipefail
          echo "E003_RADIAL_STRENGTH=${E003_RADIAL_STRENGTH}"
          echo "COMMAND=whest run --estimator experiments/e003_radial_candidate.py --dataset hf://aicrowd/arc-whestbench-public-2026@v2-phase2 --split mini --runner local"
          whest run --estimator experiments/e003_radial_candidate.py \
            --dataset hf://aicrowd/arc-whestbench-public-2026@v2-phase2 \
            --split mini \
            --runner local 2>&1 | tee "e003-${E003_RADIAL_STRENGTH}.log"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e003-radial-${{ matrix.strength }}
          path: e003-*.log
          if-no-files-found: warn

name: E114 independent exact verifier

on:
  push:
    branches:
      - review/e114-independent-verifier-20260919
    paths:
      - 'research/E114_INDEPENDENT_VERIFIER_RUN_ARM.json'

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify one-shot verifier arm
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          arm = json.loads(Path("research/E114_INDEPENDENT_VERIFIER_RUN_ARM.json").read_text())
          expected = "ARC-E114-INDEPENDENT-VERIFIER-20260919"
          if arm.get("tracking_id") != expected or arm.get("execute_once") is not True:
              raise SystemExit("invalid E114 verifier arm")
          print("E114_VERIFIER_ARM_OK")
          PY
      - name: Run independent E114 exact reference verifier
        run: python scripts/e114_independent_verifier.py
      - name: Upload immutable verifier artifact
        uses: actions/upload-artifact@v4
        with:
          name: e114-independent-verifier
          path: |
            e114-independent-verifier.json
            research/E114_INDEPENDENT_VERIFIER_RUN_ARM.json
          if-no-files-found: error
          retention-days: 90

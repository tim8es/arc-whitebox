name: E094 source-axis Stage-A

on:
  push:
    branches:
      - research/e094-source-axis-joint-compression-20260917
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  stage-a:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install -e . numpy pytest
      - name: Frozen E094 tests
        run: pytest -q tests/test_e094_source_axis.py
      - name: Frozen E094 Stage-A
        run: python scripts/e094_stage_a.py
      - name: Upload immutable Stage-A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e094-stage-a
          path: e094-stage-a.json
          if-no-files-found: warn
          retention-days: 90

name: e018-focused-tests

on:
  push:
    branches: [research/e018-importance-old-d21-20250915]
    paths:
      - tests/test_e018_importance_d21.py
      - methods/e018_importance_d21.py
      - .github/workflows/e018-tests.yml

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: python -m pip install -e . pytest
      - name: Run E018 focused tests
        run: pytest -q tests/test_e018_importance_d21.py

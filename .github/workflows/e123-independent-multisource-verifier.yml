name: E123 independent E122 multisource verifier

on:
  push:
    branches:
      - research/e123-independent-multisource-verifier-20260920
    paths:
      - 'research/E123_RUN_ARM.json'

jobs:
  e123:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify frozen verifier arm
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          expected = {
              "idempotency_key": "ARC-E123-INDEPENDENT-MULTISOURCE-VERIFIER-20260920",
              "execute_once": True,
          }
          arm = json.loads(Path("research/E123_RUN_ARM.json").read_text())
          if arm != expected:
              raise SystemExit(f"invalid E123 arm: {arm!r}")

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "HEAD^", "HEAD"], text=True
          ).splitlines()
          if changed != ["research/E123_RUN_ARM.json"]:
              raise SystemExit(f"arm commit changed unexpected paths: {changed}")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install verifier dependencies
        run: |
          python -m pip install -e .
          python -m pip install pytest==8.3.5

      - name: Syntax check
        run: |
          python -m py_compile methods/e123_multisource_verifier_fixture.py
          python -m py_compile scripts/e123_independent_multisource_verifier.py

      - name: Focused adversarial fixture tests
        run: python -m pytest -q tests/test_e123_multisource_verifier_fixture.py

      - name: Run sole frozen E123 verifier
        run: |
          set -o pipefail
          /usr/bin/time -v python scripts/e123_independent_multisource_verifier.py 2>&1 | tee e123-independent-multisource-verifier.log

      - name: Upload immutable verifier evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e123-independent-multisource-verifier
          path: |
            e123-independent-multisource-verifier.log
            e123-independent-multisource-verifier.json
            research/E123_RUN_ARM.json
          if-no-files-found: warn
          retention-days: 90

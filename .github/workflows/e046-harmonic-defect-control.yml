name: E046 harmonic defect control

on:
  push:
    branches:
      - research/e046-harmonic-defect-control-20260916
    paths:
      - 'tests/test_e046_harmonic_defect_control.py'
      - 'methods/e046_harmonic_defect_control.py'
      - '.github/workflows/e046-harmonic-defect-control.yml'
      - 'research/E046_PROTOCOL.md'

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install -e . pytest
      - name: Focused E046 tests
        run: pytest -q tests/test_e046_harmonic_defect_control.py

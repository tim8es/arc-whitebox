name: E104 E100 production budget audit

on:
  push:
    branches:
      - review/e104-e100-production-budget-audit-20260919
    paths:
      - 'scripts/e104_e100_production_budget_audit.py'
      - '.github/workflows/e104-e100-production-budget-audit.yml'

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen project dependencies
        run: python -m pip install -e .
      - name: Run one E104/E100 production budget audit
        run: python scripts/e104_e100_production_budget_audit.py
      - name: Upload immutable audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e104-e100-production-budget-audit
          path: e104-e100-production-budget-audit.json
          if-no-files-found: error
          retention-days: 90

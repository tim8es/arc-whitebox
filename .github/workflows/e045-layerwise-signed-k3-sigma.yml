name: E045 layerwise signed K3 sigma

on:
  push:
    branches:
      - research/e045-layerwise-signed-k3-sigma-20260916
    paths:
      - 'tests/test_e045_layerwise_signed_k3_sigma.py'
      - 'methods/e045_layerwise_signed_k3_sigma.py'
      - '.github/workflows/e045-layerwise-signed-k3-sigma.yml'
      - 'research/E045_PROTOCOL.md'

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install -e . pytest
      - name: Focused E045 tests
        run: pytest -q tests/test_e045_layerwise_signed_k3_sigma.py

name: E112 cumulant joint-law exact falsifier

on:
  push:
    branches:
      - research/e112-cumulant-jointlaw-20260919
    paths:
      - 'research/E112_RUN_ARM.json'

jobs:
  falsifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify frozen one-shot arm
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          expected = {
              "idempotency_key": "ARC-E112-CUMULANT-JOINTLAW-20260919",
              "execute_once": True,
          }
          arm = json.loads(Path("research/E112_RUN_ARM.json").read_text())
          if arm != expected:
              raise SystemExit(f"invalid E112 arm: {arm!r}")

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "HEAD^", "HEAD"], text=True
          ).splitlines()
          if changed != ["research/E112_RUN_ARM.json"]:
              raise SystemExit(f"arm commit changed unexpected paths: {changed}")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frozen dependencies
        run: python -m pip install -e .

      - name: Syntax check frozen falsifier
        run: python -m py_compile scripts/e112_cumulant_jointlaw_falsifier.py

      - name: Run sole exact target-free falsifier
        run: |
          set -o pipefail
          /usr/bin/time -v python scripts/e112_cumulant_jointlaw_falsifier.py 2>&1 | tee e112-cumulant-jointlaw.log

      - name: Upload immutable E112 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e112-cumulant-jointlaw
          path: |
            e112-cumulant-jointlaw.log
            e112-cumulant-jointlaw.json
            research/E112_RUN_ARM.json
          if-no-files-found: warn
          retention-days: 90

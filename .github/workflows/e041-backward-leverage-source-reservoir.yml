name: E041 backward-leverage source reservoir

on:
  push:
    branches:
      - research/e041-backward-leverage-source-reservoir-20260915
    paths:
      - 'tests/test_e041_backward_leverage_source_reservoir.py'
      - 'methods/e041_backward_leverage_source_reservoir.py'
      - '.github/workflows/e041-backward-leverage-source-reservoir.yml'

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install -e . pytest numpy
      - name: Focused E041 tests
        run: pytest -q tests/test_e041_backward_leverage_source_reservoir.py

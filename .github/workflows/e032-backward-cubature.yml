name: E032 backward leverage cubature

on:
  push:
    branches:
      - research/e032-backward-leverage-cubature-20260915
    paths:
      - 'tests/test_e032_backward_cubature.py'
      - 'methods/e032_backward_cubature.py'
      - '.github/workflows/e032-backward-cubature.yml'

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install -e . pytest numpy
      - name: Focused E032 tests
        run: pytest -q tests/test_e032_backward_cubature.py

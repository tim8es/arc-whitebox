name: E091 synthetic accuracy comparison

on:
  push:
    branches:
      - research/e091-loo-ridge-readiness-20260916
    paths:
      - 'scripts/e091_synthetic_accuracy_compare.py'
      - '.github/workflows/e091-synthetic-accuracy-compare.yml'

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numpy
        run: python -m pip install numpy==2.4.6
      - name: Run E091 synthetic baseline comparison
        run: python scripts/e091_synthetic_accuracy_compare.py
      - name: Upload E091 synthetic accuracy receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e091-synthetic-accuracy-compare
          path: e091_synthetic_accuracy_compare.json
          if-no-files-found: ignore

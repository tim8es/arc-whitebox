name: E026 final K4 damping

on:
  push:
    branches:
      - research/e026-final-k4-damp-20250915
    paths:
      - 'tests/test_e026_final_k4_damp.py'
      - 'methods/e026_final_k4_damp.py'
      - '.github/workflows/e026-final-k4-damp.yml'

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install -e . pytest
      - name: Focused E026 tests
        run: pytest -q tests/test_e026_final_k4_damp.py

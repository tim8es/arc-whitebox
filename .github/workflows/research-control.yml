name: Research control checks
on:
  pull_request:
    paths: ['scripts/arc_*.py', 'tests/test_arc_*.py', 'research/results/**', 'research/control/**', 'research/history.json', '.github/workflows/research-control.yml']
  push:
    branches: [main]
    paths: ['scripts/arc_*.py', 'tests/test_arc_*.py', 'research/results/**', 'research/control/**', 'research/history.json', '.github/workflows/research-control.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/arc_control.py check

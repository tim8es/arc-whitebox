name: E100 independent marginal-law review\n\non:\n  push:\n    branches:\n      - research/e100-orthogonal-gaussian-antithetic-20260918\n    paths:\n      - "research/E100_INDEPENDENT_REVIEW_FREEZE.json"\n      - "scripts/e100_independent_review.py"\n      - ".github/workflows/e100-independent-review.yml"\n\njobs:\n  review:\n    runs-on: ubuntu-24.04\n    timeout-minutes: 10\n    env:\n      PYTHONHASHSEED: "0"\n      OPENBLAS_NUM_THREADS: "1"\n      OMP_NUM_THREADS: "1"\n      MKL_NUM_THREADS: "1"\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: "3.11"\n      - name: Install frozen NumPy\n        run: python -m pip install numpy==2.4.6\n      - name: Run independent law and accounting review\n        run: python scripts/e100_independent_review.py\n      - name: Upload immutable independent-review evidence\n        if: always()\n        uses: actions/upload-artifact@v4\n        with:\n          name: e100-independent-review\n          path: e100-independent-review.json\n          if-no-files-found: error\n          retention-days: 90\n
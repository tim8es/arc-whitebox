name: E100 independent marginal-law review

on:
  push:
    branches:
      - research/e100-orthogonal-gaussian-antithetic-20260918
    paths:
      - "research/E100_INDEPENDENT_REVIEW_FREEZE.json"
      - "scripts/e100_independent_review.py"
      - ".github/workflows/e100-independent-review.yml"

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frozen NumPy
        run: python -m pip install numpy==2.4.6
      - name: Run independent law and accounting review
        run: python scripts/e100_independent_review.py
      - name: Upload immutable independent-review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e100-independent-review
          path: e100-independent-review.json
          if-no-files-found: error
          retention-days: 90

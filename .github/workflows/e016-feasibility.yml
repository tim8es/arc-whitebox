name: e016-feasibility

on:
  push:
    branches: [research/e016-rank1-k4-response-20260915]
  workflow_dispatch:

jobs:
  feasibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and test tools
        run: python -m pip install -e . pytest
      - name: E016 focused tests
        run: pytest -q tests/test_e016_rank1_k4.py
      - name: Install frozen dense-teacher dependencies
        if: ${{ hashFiles('scripts/e016_rank1_k4_diagnostic.py') != '' }}
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          python -m pip install scipy einops jaxtyping quimb
          git clone --filter=blob:none --no-checkout https://github.com/alignment-research-center/mlp_cumulant_propagation.git /tmp/mlp_cumulant_propagation
          git -C /tmp/mlp_cumulant_propagation fetch --depth=1 origin 93d091a4c26c042bfffa28f2e76a81bc0aba94bb
          git -C /tmp/mlp_cumulant_propagation checkout --detach 93d091a4c26c042bfffa28f2e76a81bc0aba94bb
          echo "PYTHONPATH=/tmp/mlp_cumulant_propagation/src:${PYTHONPATH}" >> "$GITHUB_ENV"
      - name: Frozen E016 diagnostic
        if: ${{ hashFiles('scripts/e016_rank1_k4_diagnostic.py') != '' }}
        run: python scripts/e016_rank1_k4_diagnostic.py

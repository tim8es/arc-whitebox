name: E166 production-shaped AGO owner

on:
  push:
    branches:
      - research/e166-production-shaped-ago-20260921
    paths:
      - 'research/E166_RUN_ARM.json'

jobs:
  e166:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: '0'
      PYTHONPATH: '.'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify frozen arm and blobs
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          expected = {
              "idempotency_key": "ARC-E166-PRODUCTION-SHAPED-AGO-20260921",
              "execute_once": True,
              "scope": "synthetic 1024x16 production-shaped AGO only",
          }
          arm = json.loads(Path("research/E166_RUN_ARM.json").read_text())
          if arm != expected:
              raise SystemExit(f"invalid arm: {arm!r}")

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "HEAD^", "HEAD"],
              text=True,
          ).splitlines()
          if changed != ["research/E166_RUN_ARM.json"]:
              raise SystemExit(f"unexpected arm diff: {changed}")

          frozen = {
              "research/E166_OWNER_PROTOCOL.md": "d3271ce7e6da160c8152be877ec63c5adb1d18f1",
              "methods/e164_ago.py": "ea9078eccc2e2bf2a2bea499ef10a4daf80ea0d4",
              "methods/e164_reference.py": "7f976941cf35e3b4d721dd7ec830b9b59791443a",
              "scripts/e166_production_shaped_ago.py": "ea7a22698089f9d98ed13248aa72bcc915ff4b3b",
          }
          for path, expected_sha in frozen.items():
              actual = subprocess.check_output(
                  ["git", "rev-parse", f"HEAD:{path}"],
                  text=True,
              ).strip()
              if actual != expected_sha:
                  raise SystemExit(
                      f"frozen blob mismatch {path}: {actual} != {expected_sha}"
                  )
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install standalone dependencies
        run: python -m pip install numpy==2.1.3 pytest==8.3.5

      - name: Syntax check
        run: |
          python -m py_compile methods/e164_ago.py
          python -m py_compile methods/e164_reference.py
          python -m py_compile scripts/e166_production_shaped_ago.py

      - name: Recheck frozen E164 unit tests
        run: python -m pytest -q tests/test_e164_ago.py

      - name: Run sole frozen E166 owner execution
        run: |
          set -o pipefail
          /usr/bin/time -v python scripts/e166_production_shaped_ago.py 2>&1 | tee e166-production-shaped-ago.log

      - name: Upload immutable E166 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e166-production-shaped-ago
          path: |
            e166-production-shaped-ago.log
            e166-production-shaped-ago.json
            research/E166_RUN_ARM.json
          if-no-files-found: warn
          retention-days: 90

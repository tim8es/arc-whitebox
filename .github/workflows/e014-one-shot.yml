name: e014-one-shot-local-then-mini

on:
  push:
    branches:
      - research/e014-batched-strassen-joiner
    paths:
      - .github/workflows/e014-one-shot.yml

jobs:
  one-shot:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned project stack
        run: python -m pip install -e .

      - name: Fetch exact V29 and build frozen E014 candidate
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            https://raw.githubusercontent.com/504aldo/whest-p2-cumulant-k3/18c17e2d7a9aeacd399cfc2c6b571e4e16dbfb45/estimators/estimator_v29.py \
            -o /tmp/estimator_v29.py
          actual="$(git hash-object /tmp/estimator_v29.py)"
          expected="17df1a073a24f96c4705b04bcf61ef60fa06dd0c"
          echo "UPSTREAM_COMMIT=18c17e2d7a9aeacd399cfc2c6b571e4e16dbfb45"
          echo "EXPECTED_GIT_BLOB=$expected"
          echo "ACTUAL_GIT_BLOB=$actual"
          test "$actual" = "$expected"
          python scripts/e014_patch_v29.py /tmp/estimator_v29.py /tmp/e014_v29.py
          python -m py_compile /tmp/e014_v29.py
          whest validate --estimator /tmp/e014_v29.py

      - name: Runtime versions
        run: |
          python - <<'PY'
          import platform
          from importlib.metadata import version
          import numpy
          import flopscope
          print("python=" + platform.python_version())
          print("numpy=" + numpy.__version__)
          print("flopscope=" + flopscope.__version__)
          print("whestbench=" + version("whestbench"))
          PY

      - name: Local diagnostic baseline arm — exact V29 mini index 0
        run: |
          python scripts/e014_local_diagnostic.py measure \
            --estimator /tmp/estimator_v29.py \
            --output e014-local-baseline.json \
            --label baseline_v29

      - name: Local diagnostic candidate arm — E014 mini index 0
        run: |
          python scripts/e014_local_diagnostic.py measure \
            --estimator /tmp/e014_v29.py \
            --output e014-local-candidate.json \
            --label candidate_e014

      - name: Apply frozen local promotion gate
        shell: bash
        run: |
          set -o pipefail
          python scripts/e014_local_diagnostic.py compare \
            --baseline e014-local-baseline.json \
            --candidate e014-local-candidate.json 2>&1 | tee e014-local-gate.log

      - name: Run exactly one official Phase-2 mini scorer
        shell: bash
        run: |
          set -o pipefail
          echo 'COMMAND=whest run --estimator /tmp/e014_v29.py --dataset hf://aicrowd/arc-whestbench-public-2026@v2-phase2 --split mini --runner local'
          /usr/bin/time -v whest run \
            --estimator /tmp/e014_v29.py \
            --dataset hf://aicrowd/arc-whestbench-public-2026@v2-phase2 \
            --split mini \
            --runner local 2>&1 | tee e014-mini.log

      - name: Upload E014 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e014-one-shot-evidence
          path: |
            e014-local-baseline.json
            e014-local-candidate.json
            e014-local-gate.log
            e014-mini.log
          if-no-files-found: warn

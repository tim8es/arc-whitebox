name: E122 Haar-8 simplex source falsifier

on:
  push:
    branches:
      - research/e122-haar8-antipodal-simplex-source-code-20260920
    paths:
      - research/E122_RUN_ARM.json

jobs:
  e122:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify frozen one-shot arm
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          expected = {
              "idempotency_key": "ARC-E122-HAAR8-ANTIPODAL-SIMPLEX-SOURCE-CODE-20260920",
              "execute_once": True,
          }
          arm = json.loads(Path("research/E122_RUN_ARM.json").read_text())
          if arm != expected:
              raise SystemExit(f"invalid E122 arm: {arm!r}")

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "HEAD^", "HEAD"], text=True
          ).splitlines()
          if changed != ["research/E122_RUN_ARM.json"]:
              raise SystemExit(f"arm commit changed unexpected paths: {changed}")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frozen project and test runner
        run: |
          python -m pip install -e .
          python -m pip install pytest==8.3.5

      - name: Syntax check
        run: |
          python -m py_compile methods/e122_haar8_simplex_source.py
          python -m py_compile scripts/e122_haar8_simplex_falsifier.py

      - name: Focused E122 tests
        run: python -m pytest -q tests/test_e122_haar8_simplex_source.py

      - name: Run sole frozen E122 falsifier
        run: |
          set -o pipefail
          /usr/bin/time -v python scripts/e122_haar8_simplex_falsifier.py             2>&1 | tee e122-haar8-simplex-falsifier.log

      - name: Upload immutable E122 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e122-haar8-simplex-falsifier
          path: |
            e122-haar8-simplex-falsifier.log
            e122-haar8-simplex-falsifier.json
            research/E122_RUN_ARM.json
          if-no-files-found: warn
          retention-days: 90

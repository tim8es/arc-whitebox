name: E119 generic boundary-flux certificate

on:
  push:
    branches:
      - research/e119-generic-boundary-flux-certificate-20260919
    paths:
      - 'research/E119_RUN_ARM.json'

jobs:
  e119:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify frozen one-shot arm
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          expected = {
              "idempotency_key": "ARC-E119-GENERIC-BOUNDARY-FLUX-CERT-20260919",
              "execute_once": True,
          }
          arm = json.loads(Path("research/E119_RUN_ARM.json").read_text())
          if arm != expected:
              raise SystemExit(f"invalid E119 arm: {arm!r}")

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "HEAD^", "HEAD"], text=True
          ).splitlines()
          if changed != ["research/E119_RUN_ARM.json"]:
              raise SystemExit(f"arm commit changed unexpected paths: {changed}")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frozen project and test runner
        run: |
          python -m pip install -e .
          python -m pip install pytest==8.3.5

      - name: Syntax check
        run: |
          python -m py_compile methods/e119_generic_boundary_flux.py
          python -m py_compile scripts/e119_generic_boundary_flux_certificate.py

      - name: Focused generic-construction tests
        run: python -m pytest -q tests/test_e119_generic_boundary_flux.py

      - name: Run sole frozen E119 construction/certificate measurement
        run: |
          set -o pipefail
          /usr/bin/time -v python scripts/e119_generic_boundary_flux_certificate.py 2>&1 | tee e119-generic-boundary-flux-certificate.log

      - name: Upload immutable E119 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e119-generic-boundary-flux-certificate
          path: |
            e119-generic-boundary-flux-certificate.log
            e119-generic-boundary-flux-certificate.json
            research/E119_RUN_ARM.json
          if-no-files-found: warn
          retention-days: 90

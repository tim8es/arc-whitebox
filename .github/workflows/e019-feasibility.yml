name: e019-feasibility

on:
  push:
    branches:
      - research/e019-multimode-k4-20260915
    paths:
      - 'methods/e019_multimode_k4.py'
      - 'tests/test_e019_multimode_k4.py'
      - 'scripts/e019_multimode_k4_diagnostic.py'
      - '.github/workflows/e019-feasibility.yml'

permissions:
  contents: read

jobs:
  feasibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and tests
        run: python -m pip install -e . pytest
      - name: E019 focused tests
        run: pytest -q tests/test_e019_multimode_k4.py
      - name: Install frozen dense-teacher dependencies
        if: ${{ hashFiles('scripts/e019_multimode_k4_diagnostic.py') != '' }}
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          python -m pip install scipy einops jaxtyping quimb joblib
          git clone --filter=blob:none --no-checkout https://github.com/alignment-research-center/mlp_cumulant_propagation.git /tmp/mlp_cumulant_propagation
          git -C /tmp/mlp_cumulant_propagation fetch --depth=1 origin 93d091a4c26c042bfffa28f2e76a81bc0aba94bb
          git -C /tmp/mlp_cumulant_propagation checkout --detach 93d091a4c26c042bfffa28f2e76a81bc0aba94bb
          echo "PYTHONPATH=/tmp/mlp_cumulant_propagation/src:${PYTHONPATH}" >> "$GITHUB_ENV"
      - name: Frozen E019 diagnostic
        if: ${{ hashFiles('scripts/e019_multimode_k4_diagnostic.py') != '' }}
        run: python scripts/e019_multimode_k4_diagnostic.py

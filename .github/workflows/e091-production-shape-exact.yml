name: E091 production-shape exact-family

on:
  push:
    branches:
      - research/e091-loo-ridge-readiness-20260916
    paths:
      - 'research/E091_PRODUCTION_SHAPE_EXACT_FAMILY_FREEZE.json'
      - 'tests/test_e091_production_shape_exact.py'
      - 'methods/e091_production_shape_exact.py'
      - 'scripts/e091_production_shape_exact_falsifier.py'
      - '.github/workflows/e091-production-shape-exact.yml'

jobs:
  frozen:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install -e . pytest
      - name: Focused production-shape exact-family tests
        run: pytest -q tests/test_e091_production_shape_exact.py
      - name: Exactly one frozen production-shape E091 falsifier
        run: python scripts/e091_production_shape_exact_falsifier.py
      - name: Upload immutable production-shape evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e091-production-shape-exact-result
          path: e091-production-shape-exact-result.json
          if-no-files-found: error

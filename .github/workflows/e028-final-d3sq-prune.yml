name: E028 final D3-squared prune

on:
  push:
    branches:
      - research/e028-final-d3sq-prune-20250915
    paths:
      - 'tests/test_e028_final_d3sq_prune.py'
      - 'methods/e028_final_d3sq_prune.py'
      - 'scripts/run_e028_final_d3sq_prune.py'
      - '.github/workflows/e028-final-d3sq-prune.yml'

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install -e . pytest
      - name: Focused E028 tests only
        run: pytest -q tests/test_e028_final_d3sq_prune.py
      - name: Frozen E028 diagnostic is sealed
        run: echo 'Scientific diagnostic sealed after unintended post-result rerun 35001635266; authoritative frozen evidence remains run 34984554189 / job 104433192579; no further diagnostic runs are authorized.'

name: E033 diagonal Edgeworth

on:
  push:
    branches:
      - research/e033-diagonal-edgeworth-20260915
    paths:
      - 'tests/test_e033_diagonal_edgeworth.py'
      - 'methods/e033_diagonal_edgeworth.py'
      - 'scripts/run_e033_diagonal_edgeworth.py'
      - '.github/workflows/e033-diagonal-edgeworth.yml'

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install -e . pytest numpy pyarrow huggingface_hub
      - name: Focused E033 tests
        run: pytest -q tests/test_e033_diagonal_edgeworth.py
      - name: Frozen E033 diagnostic
        run: python scripts/run_e033_diagonal_edgeworth.py

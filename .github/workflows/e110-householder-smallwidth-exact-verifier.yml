name: E110 Householder exact independent verifier

on:
  push:
    branches:
      - review/e110-householder-smallwidth-exact-verifier-20260919
    paths:
      - 'research/E110_HOUSEHOLDER_SMALLWIDTH_VERIFIER_RUN_ARM.json'

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify one-shot verifier arm
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          arm = json.loads(Path("research/E110_HOUSEHOLDER_SMALLWIDTH_VERIFIER_RUN_ARM.json").read_text())
          expected = "ARC-E110-HOUSEHOLDER-SMALLWIDTH-VERIFIER-20260919"
          if arm.get("tracking_id") != expected or arm.get("execute_once") is not True:
              raise SystemExit("invalid verifier arm")
          print("E110_HOUSEHOLDER_VERIFIER_ARM_OK")
          PY
      - name: Install frozen project dependencies
        run: python -m pip install -e . pytest
      - name: Run focused verifier tests
        run: python -m pytest -q tests/test_e110_householder_smallwidth_exact_verifier.py
      - name: Run exact small-width verifier once
        run: python scripts/e110_householder_smallwidth_exact_verifier.py
      - name: Upload immutable verifier artifact
        uses: actions/upload-artifact@v4
        with:
          name: e110-householder-smallwidth-exact-verifier
          path: |
            e110-householder-smallwidth-verifier.json
            research/E110_HOUSEHOLDER_SMALLWIDTH_VERIFIER_RUN_ARM.json
          if-no-files-found: error
          retention-days: 90

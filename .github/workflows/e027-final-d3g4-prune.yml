name: E027 final D3-G4 prune

on:
  push:
    branches:
      - research/e027-final-d3g4-prune-20250915
    paths:
      - 'tests/test_e027_final_d3g4_prune.py'
      - 'methods/e027_final_d3g4_prune.py'
      - '.github/workflows/e027-final-d3g4-prune.yml'

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install -e . pytest
      - name: Focused E027 tests
        run: pytest -q tests/test_e027_final_d3g4_prune.py

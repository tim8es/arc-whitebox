name: E119 independent boundary audit

on:
  push:
    branches:
      - review/e119-independent-boundary-audit-20260919
    paths:
      - '.github/workflows/e119-independent-boundary-audit.yml'

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen project dependencies
        run: python -m pip install -e .
      - name: Run sole E119 independent audit
        run: python scripts/e119_independent_boundary_audit.py
      - name: Upload immutable E119 audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e119-independent-boundary-audit
          path: e119-independent-boundary-audit.json
          if-no-files-found: error
          retention-days: 90

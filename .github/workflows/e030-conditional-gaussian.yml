name: E030 conditional Gaussian carrier

on:
  push:
    branches:
      - research/e030-r8-conditional-gaussian-carrier-20260915
    paths:
      - 'tests/test_e030_conditional_gaussian.py'
      - 'methods/e030_conditional_gaussian.py'
      - '.github/workflows/e030-conditional-gaussian.yml'

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install -e . pytest numpy scipy
      - name: Focused E030 tests
        run: pytest -q tests/test_e030_conditional_gaussian.py

name: E030 conditional Gaussian carrier

on:
  push:
    branches:
      - research/e030-r8-conditional-gaussian-carrier-20260915
    paths:
      - 'tests/test_e030_conditional_gaussian.py'
      - 'methods/e030_conditional_gaussian.py'
      - 'scripts/run_e030_conditional_gaussian.py'
      - '.github/workflows/e030-conditional-gaussian.yml'

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install -e . pytest numpy scipy pyarrow huggingface_hub
      - name: Focused E030 tests
        run: pytest -q tests/test_e030_conditional_gaussian.py
      - name: Frozen E030 diagnostic
        run: python scripts/run_e030_conditional_gaussian.py
      - name: Upload frozen E030 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e030-conditional-gaussian-result
          path: e030_result.json
          if-no-files-found: ignore

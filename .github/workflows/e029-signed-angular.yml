name: E029 signed layer1 angular

on:
  push:
    branches:
      - research/e029-signed-layer1-angular-20260915
    paths:
      - 'tests/test_e029_signed_angular.py'
      - 'methods/e029_signed_angular.py'
      - '.github/workflows/e029-signed-angular.yml'

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install -e . pytest numpy
      - name: Focused E029 tests
        run: pytest -q tests/test_e029_signed_angular.py

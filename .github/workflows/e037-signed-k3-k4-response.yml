name: E037 signed K3 K4 response

on:
  push:
    branches:
      - research/e037-signed-k3-k4-response-20260915
    paths:
      - 'tests/test_e037_signed_k3_k4_response.py'
      - 'methods/e037_signed_k3_k4_response.py'
      - 'scripts/run_e037_signed_k3_k4_response.py'
      - '.github/workflows/e037-signed-k3-k4-response.yml'

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install -e . pytest numpy pyarrow huggingface_hub
      - name: Focused E037 tests
        run: pytest -q tests/test_e037_signed_k3_k4_response.py
      - name: Frozen E037 diagnostic
        run: python scripts/run_e037_signed_k3_k4_response.py
      - name: Upload frozen E037 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e037-frozen-result
          path: e037_result.json
          if-no-files-found: ignore

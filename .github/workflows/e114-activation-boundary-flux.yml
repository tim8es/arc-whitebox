name: E114 activation-boundary flux identity

on:
  push:
    branches:
      - research/e114-activation-boundary-flux-20260919
    paths:
      - 'research/E114_PROTOCOL.md'
      - 'scripts/e114_activation_boundary_flux.py'
      - '.github/workflows/e114-activation-boundary-flux.yml'

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'

jobs:
  exact-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run frozen E114 exact identity test
        run: python scripts/e114_activation_boundary_flux.py
      - name: Upload immutable E114 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e114-activation-boundary-flux
          path: e114_activation_boundary_flux.json
          if-no-files-found: error
          retention-days: 90

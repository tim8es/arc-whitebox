name: E091 production-base falsifier

on:
  push:
    branches:
      - research/e091-loo-ridge-readiness-20260916
    paths:
      - scripts/e091_production_base_falsifier.py
      - methods/e091_production_bridge.py
      - research/E091_PRODUCTION_BASE_SCREEN_V2.json
      - .github/workflows/e091-production-base-falsifier.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  falsifier:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and frozen numpy
        run: python -m pip install -e . numpy==2.4.6
      - name: Run E091 production-base falsifier
        run: python scripts/e091_production_base_falsifier.py
      - name: Upload immutable falsifier evidence
        uses: actions/upload-artifact@v4
        with:
          name: e091-production-base-falsifier
          path: e091_production_base_falsifier.json
          if-no-files-found: error
          retention-days: 90

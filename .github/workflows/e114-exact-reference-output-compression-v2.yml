name: E114 exact output-compression reference v2

on:
  push:
    branches:
      - research/e114-exact-reference-output-compression-20260919
    paths:
      - 'research/E114_EXACT_REFERENCE_RUN_ARM_V2.json'

jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify engineering-successor authorization and frozen science
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          key = "ARC-E114-EXACT-REFERENCE-OUTPUT-COMPRESSION-V2-20260919"
          arm_path = Path("research/E114_EXACT_REFERENCE_RUN_ARM_V2.json")
          arm = json.loads(arm_path.read_text())
          if arm != {"idempotency_key": key, "execute_once": True}:
              raise SystemExit(f"invalid v2 arm: {arm!r}")

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "HEAD^", "HEAD"], text=True
          ).splitlines()
          if changed != ["research/E114_EXACT_REFERENCE_RUN_ARM_V2.json"]:
              raise SystemExit(f"v2 arm commit changed unexpected paths: {changed}")

          prior = subprocess.run(
              ["git", "cat-file", "-e", "HEAD^:research/E114_EXACT_REFERENCE_RUN_ARM_V2.json"],
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
          )
          if prior.returncode == 0:
              raise SystemExit("v2 arm already existed before this commit")

          auth = json.loads(
              subprocess.check_output(
                  ["git", "show", "HEAD^:research/E114_EXACT_REFERENCE_SUCCESSOR_AUTHORIZATION.json"],
                  text=True,
              )
          )
          if auth.get("status") != "AUTHORIZED_ENGINEERING_RETRY_SCIENCE_UNEXECUTED":
              raise SystemExit("successor authorization status mismatch")
          if auth.get("idempotency_key") != key:
              raise SystemExit("successor authorization key mismatch")

          frozen = {
              "methods/e114_exact_angular_reference.py": "3a8467f88501c114cb1540909777dbe266ad0be5",
              "tests/test_e114_exact_angular_reference.py": "e18832b65acf2bd3385c9e575a9e26243cedb099",
              "scripts/e114_exact_reference_output_compression.py": "d4b8241d7d813e75472c0dd6d1a01e88583b8e6b",
          }
          for path, expected in frozen.items():
              actual = subprocess.check_output(
                  ["git", "rev-parse", f"HEAD:{path}"], text=True
              ).strip()
              if actual != expected:
                  raise SystemExit(f"frozen blob mismatch for {path}: {actual} != {expected}")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frozen project and test runner
        run: |
          python -m pip install -e .
          python -m pip install pytest==8.3.5

      - name: Syntax check reusable reference
        run: |
          python -m py_compile methods/e114_exact_angular_reference.py
          python -m py_compile scripts/e114_exact_reference_output_compression.py

      - name: Focused exact-reference tests
        run: python -m pytest -q tests/test_e114_exact_angular_reference.py

      - name: Run sole frozen exact reference
        run: |
          set -o pipefail
          /usr/bin/time -v python scripts/e114_exact_reference_output_compression.py 2>&1 | tee e114-exact-reference-output-compression-v2.log

      - name: Upload immutable exact-reference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e114-exact-reference-output-compression-v2
          path: |
            e114-exact-reference-output-compression-v2.log
            e114-exact-reference-output-compression.json
            research/E114_EXACT_REFERENCE_RUN_ARM_V2.json
          if-no-files-found: warn
          retention-days: 90

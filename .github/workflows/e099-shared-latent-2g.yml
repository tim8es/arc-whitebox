name: E099 shared-latent 2G structural falsifier

on:
  push:
    branches:
      - research/e099-shared-latent-2g-closure-20260918
    paths:
      - 'research/E099_PROTOCOL.md'
      - 'scripts/e099_shared_latent_2g_falsifier.py'
      - '.github/workflows/e099-shared-latent-2g.yml'

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  falsifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen project dependencies
        run: python -m pip install -e .
      - name: Run exactly one frozen E099 structural falsifier
        run: python scripts/e099_shared_latent_2g_falsifier.py
      - name: Upload immutable E099 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e099-shared-latent-2g-result
          path: e099_shared_latent_2g_result.json
          if-no-files-found: error
          retention-days: 90

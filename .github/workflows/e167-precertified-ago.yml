name: E167 pre-certified production-shaped AGO owner

on:
  push:
    branches:
      - research/e167-precertified-reference-ago-20260921
    paths:
      - 'research/E167_RUN_ARM.json'

jobs:
  e167:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: '0'
      PYTHONPATH: '.'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify frozen arm and blobs
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          expected = {
              "idempotency_key": "ARC-E167-PRECERTIFIED-REFERENCE-AGO-20260921",
              "execute_once": True,
              "scope": "synthetic 1024x16 AGO with pre-certified reference only",
          }
          arm = json.loads(Path("research/E167_RUN_ARM.json").read_text())
          if arm != expected:
              raise SystemExit(f"invalid arm: {arm!r}")

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "HEAD^", "HEAD"],
              text=True,
          ).splitlines()
          if changed != ["research/E167_RUN_ARM.json"]:
              raise SystemExit(f"unexpected arm diff: {changed}")

          frozen = {
              "research/E167_OWNER_PROTOCOL.md": "d542c0a4a4c2367fa310669d5f8fef94b858bccf",
              "methods/e164_ago.py": "ea9078eccc2e2bf2a2bea499ef10a4daf80ea0d4",
              "methods/e167_reference_streaming.py": "f8fdb5f4855dbf175d9d67638b15c49471004c9a",
              "tests/test_e167_reference.py": "d9691c812682b8c6eec63c476e36db5a650940cd",
              "scripts/e167_precertified_ago.py": "ddf801086d65d459120d42842d7e405e0fca4fe5",
          }
          for path, expected_sha in frozen.items():
              actual = subprocess.check_output(
                  ["git", "rev-parse", f"HEAD:{path}"],
                  text=True,
              ).strip()
              if actual != expected_sha:
                  raise SystemExit(
                      f"frozen blob mismatch {path}: {actual} != {expected_sha}"
                  )
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install standalone dependencies
        run: python -m pip install numpy==2.1.3 pytest==8.3.5

      - name: Syntax check
        run: |
          python -m py_compile methods/e164_ago.py
          python -m py_compile methods/e167_reference_streaming.py
          python -m py_compile scripts/e167_precertified_ago.py

      - name: Focused tests
        run: |
          python -m pytest -q tests/test_e164_ago.py
          python -m pytest -q tests/test_e167_reference.py

      - name: Run sole frozen E167 owner execution
        run: |
          set -o pipefail
          /usr/bin/time -v python scripts/e167_precertified_ago.py 2>&1 | tee e167-precertified-ago.log

      - name: Upload immutable E167 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e167-precertified-ago
          path: |
            e167-precertified-ago.log
            e167-precertified-ago.json
            research/E167_RUN_ARM.json
          if-no-files-found: warn
          retention-days: 90

name: E098 sole frozen Stage-A

on:
  push:
    branches:
      - research/e098-late-k22-response-relevance-20260918
    paths:
      - 'scripts/e098_stage_a.py'
      - '.github/workflows/e098-stage-a.yml'

jobs:
  stage-a:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen dependency
        run: python -m pip install numpy==2.4.6
      - name: Run exactly one frozen E098 Stage-A
        run: python scripts/e098_stage_a.py
      - name: Upload immutable Stage-A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e098-stage-a
          path: e098-stage-a.json
          if-no-files-found: error
          retention-days: 90

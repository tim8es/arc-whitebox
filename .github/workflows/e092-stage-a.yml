name: E092 sole synthetic Stage-A

on:
  push:
    branches:
      - research/e092-frozen-loo-residual-calibrator-20260917
    paths:
      - ".github/workflows/e092-stage-a.yml"

jobs:
  stage-a:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Run frozen E092 Stage-A
        run: python scripts/e092_stage_a.py
      - name: Upload immutable Stage-A receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e092-stage-a-receipt
          path: artifacts/e092_stage_a_receipt.json
          if-no-files-found: error

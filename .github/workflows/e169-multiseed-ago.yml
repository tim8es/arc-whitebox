name: E169 multi-seed production AGO owner

on:
  push:
    branches:
      - research/e169-multiseed-ago-20260921
    paths:
      - 'research/E169_RUN_ARM.json'

jobs:
  e169:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: '0'
      PYTHONPATH: '.'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify frozen arm and blobs
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          expected = {
              "idempotency_key": "ARC-E169-MULTISEED-PRODUCTION-AGO-20260921",
              "execute_once": True,
              "scope": "synthetic multi-seed 1024x16 AGO only",
          }
          arm = json.loads(Path("research/E169_RUN_ARM.json").read_text())
          if arm != expected:
              raise SystemExit(f"invalid arm: {arm!r}")

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "HEAD^", "HEAD"],
              text=True,
          ).splitlines()
          if changed != ["research/E169_RUN_ARM.json"]:
              raise SystemExit(f"unexpected arm diff: {changed}")

          frozen = {
              "research/E169_OWNER_PROTOCOL.md": "127fe7a2ced0fab545904c79654f1f2ee956ccea",
              "methods/e164_ago.py": "ea9078eccc2e2bf2a2bea499ef10a4daf80ea0d4",
              "methods/e169_reference_streaming.py": "bed83baec6eea86b880cbacb7ea1b300e9782165",
              "tests/test_e169_reference.py": "fe09b62ce7a5e9cc1f6b3f0088aec689b141abd6",
              "scripts/e169_multiseed_ago.py": "b43df48e322976ddc0e9d4a344e927a76b2db887",
          }
          for path, expected_sha in frozen.items():
              actual = subprocess.check_output(
                  ["git", "rev-parse", f"HEAD:{path}"],
                  text=True,
              ).strip()
              if actual != expected_sha:
                  raise SystemExit(
                      f"frozen blob mismatch {path}: {actual} != {expected_sha}"
                  )
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install standalone dependencies
        run: python -m pip install numpy==2.1.3 pytest==8.3.5

      - name: Syntax check
        run: |
          python -m py_compile methods/e164_ago.py
          python -m py_compile methods/e169_reference_streaming.py
          python -m py_compile scripts/e169_multiseed_ago.py

      - name: Focused tests
        run: |
          python -m pytest -q tests/test_e164_ago.py
          python -m pytest -q tests/test_e169_reference.py

      - name: Run sole frozen E169 owner execution
        run: |
          set -o pipefail
          /usr/bin/time -v python scripts/e169_multiseed_ago.py 2>&1 | tee e169-multiseed-ago.log

      - name: Upload immutable E169 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e169-multiseed-ago
          path: |
            e169-multiseed-ago.log
            e169-multiseed-ago.json
            research/E169_RUN_ARM.json
          if-no-files-found: warn
          retention-days: 90

name: E164 clean-room AGO target-free falsifier

on:
  push:
    branches:
      - research/e164-cleanroom-ago-20260921
    paths:
      - 'research/E164_RUN_ARM.json'

jobs:
  e164:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: '0'
      PYTHONPATH: '.'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify frozen arm and blobs
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          expected = {
              "idempotency_key": "ARC-E164-CLEANROOM-AGO-20260921",
              "execute_once": True,
              "scope": "target-free exact2D dense32 adversarial16 only",
          }
          arm = json.loads(Path("research/E164_RUN_ARM.json").read_text())
          if arm != expected:
              raise SystemExit(f"invalid arm: {arm!r}")

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "HEAD^", "HEAD"],
              text=True,
          ).splitlines()
          if changed != ["research/E164_RUN_ARM.json"]:
              raise SystemExit(f"unexpected arm diff: {changed}")

          frozen = {
              "research/E164_OWNER_PROTOCOL.md": "b9b4c5d7d655c0f8a7650512cf30f89f8f9a11ba",
              "methods/e164_ago.py": "ea9078eccc2e2bf2a2bea499ef10a4daf80ea0d4",
              "methods/e164_reference.py": "7f976941cf35e3b4d721dd7ec830b9b59791443a",
              "tests/test_e164_ago.py": "309ab16198b750b0043922d4043264102ddb3143",
              "scripts/e164_ago_falsifier.py": "f9472e5193491575c1eb9372874df736b2739464",
          }
          for path, expected_sha in frozen.items():
              actual = subprocess.check_output(
                  ["git", "rev-parse", f"HEAD:{path}"],
                  text=True,
              ).strip()
              if actual != expected_sha:
                  raise SystemExit(
                      f"frozen blob mismatch {path}: {actual} != {expected_sha}"
                  )
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install standalone dependencies
        run: python -m pip install numpy==2.1.3 pytest==8.3.5

      - name: Syntax check
        run: |
          python -m py_compile methods/e164_ago.py
          python -m py_compile methods/e164_reference.py
          python -m py_compile scripts/e164_ago_falsifier.py

      - name: Focused tests
        run: python -m pytest -q tests/test_e164_ago.py

      - name: Run sole frozen E164 target-free falsifier
        run: |
          set -o pipefail
          /usr/bin/time -v python scripts/e164_ago_falsifier.py 2>&1 | tee e164-ago.log

      - name: Upload immutable E164 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e164-ago
          path: |
            e164-ago.log
            e164-ago-result.json
            research/E164_RUN_ARM.json
          if-no-files-found: warn
          retention-days: 90

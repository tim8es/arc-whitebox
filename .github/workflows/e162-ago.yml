name: E162 AGO target-free falsifier

on:
  push:
    branches:
      - research/e162-owner-ago-gauge-only-20260921
    paths:
      - 'research/E162_RUN_ARM.json'

jobs:
  e162:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify frozen arm and blobs
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          expected = {
              "idempotency_key": "ARC-E162-OWNER-AGO-GAUGE-ONLY-20260921",
              "execute_once": True,
              "scope": "target-free exact2D dense32 adversarial16 only",
          }
          arm = json.loads(Path("research/E162_RUN_ARM.json").read_text())
          if arm != expected:
              raise SystemExit(f"invalid arm: {arm!r}")

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "HEAD^", "HEAD"],
              text=True,
          ).splitlines()
          if changed != ["research/E162_RUN_ARM.json"]:
              raise SystemExit(
                  f"arm commit changed unexpected paths: {changed}"
              )

          frozen = {
              "research/E162_OWNER_PROTOCOL.md": "32a5b809ddfc9bbcc1426f6076a7ed4362101a47",
              "methods/e162_ago.py": "4c30094d53fc16a2523edf0e97e2a1be5a36d2fa",
              "methods/e162_reference.py": "f131f8f442d5931424f548bbea39966b98168e7a",
              "tests/test_e162_ago.py": "f83d1690948fea563666a76e2ce5c85a074a1a2a",
              "scripts/e162_ago_falsifier.py": "06cd18c2412c23a5f436909ca97b1f60d36cea95",
          }
          for path, expected_sha in frozen.items():
              actual = subprocess.check_output(
                  ["git", "rev-parse", f"HEAD:{path}"],
                  text=True,
              ).strip()
              if actual != expected_sha:
                  raise SystemExit(
                      f"frozen blob mismatch {path}: "
                      f"{actual} != {expected_sha}"
                  )
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project and test dependency
        run: |
          python -m pip install -e .
          python -m pip install pytest==8.3.5

      - name: Syntax check
        run: |
          python -m py_compile methods/e162_ago.py
          python -m py_compile methods/e162_reference.py
          python -m py_compile scripts/e162_ago_falsifier.py

      - name: Focused tests
        run: python -m pytest -q tests/test_e162_ago.py

      - name: Run sole frozen E162 target-free falsifier
        run: |
          set -o pipefail
          /usr/bin/time -v python scripts/e162_ago_falsifier.py 2>&1 | tee e162-ago.log

      - name: Upload immutable E162 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e162-ago
          path: |
            e162-ago.log
            e162-ago-result.json
            research/E162_RUN_ARM.json
          if-no-files-found: warn
          retention-days: 90

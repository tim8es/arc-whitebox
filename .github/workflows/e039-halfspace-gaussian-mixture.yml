name: E039 half-space Gaussian mixture

on:
  push:
    branches:
      - research/e039-halfspace-gaussian-mixture-20260915
    paths:
      - 'tests/test_e039_halfspace_gaussian_mixture.py'
      - 'methods/e039_halfspace_gaussian_mixture.py'
      - 'scripts/run_e039_halfspace_gaussian_mixture.py'
      - '.github/workflows/e039-halfspace-gaussian-mixture.yml'

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install -e . pytest numpy pyarrow huggingface_hub
      - name: Focused E039 tests
        run: pytest -q tests/test_e039_halfspace_gaussian_mixture.py
      - name: Frozen E039 diagnostic
        run: python scripts/run_e039_halfspace_gaussian_mixture.py
      - name: Upload frozen E039 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e039-frozen-result
          path: e039_result.json
          if-no-files-found: ignore

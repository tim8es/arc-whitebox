name: E104 frozen radial Rao-Blackwell Stage-A

on:
  push:
    branches:
      - research/e104-haar-radial-raoblackwell-20260918
    paths:
      - 'scripts/e104_stage_a.py'
      - '.github/workflows/e104-stage-a.yml'

jobs:
  stage-a:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen NumPy
        run: python -m pip install numpy==2.4.6
      - name: Run sole E104 synthetic Stage-A
        run: python scripts/e104_stage_a.py
      - name: Upload immutable E104 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e104-stage-a
          path: e104-stage-a.json
          if-no-files-found: error
          retention-days: 90

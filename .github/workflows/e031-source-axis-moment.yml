name: E031 source-axis moment closure

on:
  push:
    branches:
      - research/e031-source-axis-moment-closure-20260915

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install -e . pytest numpy scipy pyarrow huggingface_hub
      - name: Focused E031 tests
        run: pytest -q tests/test_e031_source_axis_moment.py

name: E040 late-source exact window

on:
  push:
    branches:
      - research/e040-late-source-exact-window-20260915
    paths:
      - 'tests/test_e040_late_source_exact_window.py'
      - 'methods/e040_late_source_exact_window.py'
      - '.github/workflows/e040-late-source-exact-window.yml'

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install -e . pytest
      - name: Focused E040 tests
        run: pytest -q tests/test_e040_late_source_exact_window.py

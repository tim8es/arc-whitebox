name: E173 official local Mini AGO integration

on:
  push:
    branches:
      - research/e173-official-mini-ago-integration-20260921
    paths:
      - 'research/E173_RUN_ARM.json'

jobs:
  e173:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONHASHSEED: '0'
      PYTHONPATH: '.'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      WHEST_SKIP_HARDWARE_FALLBACK_PROBES: '1'
      HF_XET_HIGH_PERFORMANCE: '1'
      PYTHONUNBUFFERED: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify frozen arm, clean lineage, and blobs
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          expected = {
              "idempotency_key": "ARC-E173-OFFICIAL-MINI-AGO-INTEGRATION-20260921",
              "execute": True,
              "attempt": 1,
              "scope": "official local v2-phase2 mini first 5; parent vs AGO; no submission",
          }
          arm = json.loads(Path("research/E173_RUN_ARM.json").read_text())
          if arm != expected:
              raise SystemExit(f"invalid arm: {arm!r}")

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "HEAD^", "HEAD"],
              text=True,
          ).splitlines()
          if changed != ["research/E173_RUN_ARM.json"]:
              raise SystemExit(f"unexpected arm diff: {changed}")

          frozen = {
              "research/E173_OWNER_PROTOCOL.md": "422f217f7a9055156e2b4959bcbd5f7bcf5ed5b4",
              "methods/e173_starter_ago.py": "67516eeea5efe859cb4f00adaa479d5c8143c866",
              "methods/e173_parent_estimator.py": "591800e3f4cf50d518c654c4be59cea4996cc33b",
              "methods/e173_ago_estimator.py": "b80545d085b341f24dd1be3ad590e79f17904c39",
              "tests/test_e173_starter_ago.py": "9e29d8333d7fc4f8904bddf0bf18f3abce06f519",
              "scripts/e173_capture_vectors.py": "25a8387c41ae4feb5e2890050a22e2844f4ab83d",
              "scripts/e173_summarize.py": "dbb0344843c9cd44fc6e2ac0a6ad8413ebf741ae",
              "methods/e164_ago.py": "ea9078eccc2e2bf2a2bea499ef10a4daf80ea0d4",
              "baselines/covariance_propagation.py": "f547b378faa56e299559bcefc89909fd401b8026",
              "estimator.py": "935a994072265155fd79d2db373f28c6fa7e5550",
          }
          for path, expected_sha in frozen.items():
              actual = subprocess.check_output(
                  ["git", "rev-parse", f"HEAD:{path}"],
                  text=True,
              ).strip()
              if actual != expected_sha:
                  raise SystemExit(
                      f"frozen blob mismatch {path}: {actual} != {expected_sha}"
                  )

          base = "fea2747b04bd8027bdd98c9680ebce1dc1bb022c"
          mb = subprocess.check_output(
              ["git", "merge-base", base, "HEAD"],
              text=True,
          ).strip()
          if mb != base:
              raise SystemExit(f"E171 receipt is not merge base: {mb}")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned integration toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install             flopscope==0.12.1             whestbench==0.16.1             numpy==2.1.3             pytest==8.3.5

      - name: Record environment
        run: |
          mkdir -p e173_artifacts
          whest version --json > e173_artifacts/whest_version.json
          python - <<'PY' > e173_artifacts/environment.txt
          import platform
          import datasets
          import flopscope
          import numpy
          import whestbench
          print("python", platform.python_version())
          print("platform", platform.platform())
          print("numpy", numpy.__version__)
          print("datasets", datasets.__version__)
          print("flopscope", getattr(flopscope, "__version__", "unknown"))
          print("whestbench", getattr(whestbench, "__version__", "unknown"))
          PY
          python -m pip freeze > e173_artifacts/pip-freeze.txt

      - name: Syntax check
        run: |
          python -m py_compile methods/e173_starter_ago.py
          python -m py_compile methods/e173_parent_estimator.py
          python -m py_compile methods/e173_ago_estimator.py
          python -m py_compile scripts/e173_capture_vectors.py
          python -m py_compile scripts/e173_summarize.py

      - name: Focused integration tests
        shell: bash
        run: |
          set +e
          python -m pytest -q             tests/test_e164_ago.py             tests/test_e173_starter_ago.py             > e173_artifacts/focused_tests.log 2>&1
          code=$?
          echo "$code" > e173_artifacts/focused_tests.exit
          cat e173_artifacts/focused_tests.log
          exit "$code"

      - name: Validate parent entrypoint
        id: validate_parent
        continue-on-error: true
        shell: bash
        run: |
          set +e
          whest validate             --estimator methods/e173_parent_estimator.py             --json             > e173_artifacts/parent_validate.json             2> e173_artifacts/parent_validate.stderr
          code=$?
          echo "$code" > e173_artifacts/parent_validate.exit
          exit "$code"

      - name: Validate AGO entrypoint and fallback
        id: validate_ago
        continue-on-error: true
        shell: bash
        run: |
          set +e
          whest validate             --estimator methods/e173_ago_estimator.py             --json             > e173_artifacts/ago_validate.json             2> e173_artifacts/ago_validate.stderr
          code=$?
          echo "$code" > e173_artifacts/ago_validate.exit
          exit "$code"

      - name: Capture verifier-ready vectors on first 5 official Mini MLPs
        id: capture
        continue-on-error: true
        shell: bash
        run: |
          set +e
          /usr/bin/time -v python scripts/e173_capture_vectors.py             > e173_artifacts/capture.log             2> e173_artifacts/capture.stderr
          code=$?
          echo "$code" > e173_artifacts/capture.exit
          cat e173_artifacts/capture.log
          exit "$code"

      - name: Official local Mini parent run
        id: run_parent
        continue-on-error: true
        shell: bash
        run: |
          set +e
          whest run             --estimator methods/e173_parent_estimator.py             --dataset hf://aicrowd/arc-whestbench-public-2026@v2-phase2             --split mini             --streaming             --n-mlps 5             --runner local             --flop-budget 2199023255552             --wall-time-limit 120             --residual-wall-time-limit 0.4             --max-threads 1             --format json             > e173_artifacts/parent_report.json             2> e173_artifacts/parent_run.stderr
          code=$?
          echo "$code" > e173_artifacts/parent_run.exit
          exit "$code"

      - name: Official local Mini AGO run
        id: run_ago
        continue-on-error: true
        shell: bash
        run: |
          set +e
          whest run             --estimator methods/e173_ago_estimator.py             --dataset hf://aicrowd/arc-whestbench-public-2026@v2-phase2             --split mini             --streaming             --n-mlps 5             --runner local             --flop-budget 2199023255552             --wall-time-limit 120             --residual-wall-time-limit 0.4             --max-threads 1             --format json             > e173_artifacts/ago_report.json             2> e173_artifacts/ago_run.stderr
          code=$?
          echo "$code" > e173_artifacts/ago_run.exit
          exit "$code"

      - name: Build frozen E173 summary
        if: always()
        id: summarize
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/e173_summarize.py             > e173_artifacts/summarize.log             2> e173_artifacts/summarize.stderr
          code=$?
          echo "$code" > e173_artifacts/summarize.exit
          cat e173_artifacts/summarize.log
          exit "$code"

      - name: Hash all retained evidence
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          paths = []
          for root in (Path("e173_artifacts"), Path("e173_vectors")):
              if root.exists():
                  paths.extend(p for p in root.rglob("*") if p.is_file())
          for p in (
              Path("e173_vector_manifest.json"),
              Path("research/E173_RUN_ARM.json"),
          ):
              if p.is_file():
                  paths.append(p)

          sha_path = Path("e173_artifacts/sha256.json")
          paths = sorted({p for p in paths if p != sha_path}, key=str)
          out = {
              str(p): hashlib.sha256(p.read_bytes()).hexdigest()
              for p in paths
          }
          sha_path.write_text(
              json.dumps(out, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print("hashed", len(out), "files")
          PY

      - name: Upload immutable E173 integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e173-official-mini-ago
          path: |
            e173_artifacts/
            e173_vectors/**/*.npy
            e173_vector_manifest.json
            research/E173_RUN_ARM.json
          if-no-files-found: warn
          retention-days: 90

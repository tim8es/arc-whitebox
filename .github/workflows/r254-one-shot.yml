name: R254 one-shot BPK2K global accuracy

on:
  push:
    branches:
      - research/r254-balanced-rider-reduction-20260923
    paths:
      - .github/workflows/r254-one-shot.yml

jobs:
  r254:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      WHEST_SKIP_HARDWARE_FALLBACK_PROBES: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Initialize immutable evidence
        run: |
          mkdir -p r254_artifacts
          printf '%s\n' "$GITHUB_SHA" > r254_artifacts/workflow_head_sha.txt
          printf '%s\n' "$RUNNER_OS" > r254_artifacts/runner_os.txt
          printf '%s\n' "$ImageOS" > r254_artifacts/image_os.txt

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"

      - name: Verify pinned wheels and corrected distribution versions
        run: |
          set -euo pipefail
          test "$(python -c 'import platform; print(platform.python_version())')" = "3.11.16"
          python -m pip download --no-deps --only-binary=:all:             numpy==2.4.6 flopscope==0.12.1 whestbench==0.16.1 -d r254_wheels
          echo "89cd468399cfd2504718f0ba50e410dca55a170b61a02ad92bb18c8a65186e93  r254_wheels/numpy-2.4.6-cp311-cp311-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl" | sha256sum -c -
          echo "cd08df7e0eb468117b9a48b82d076130a9a9858ec20fdc0d015e2bd477519582  r254_wheels/flopscope-0.12.1-py3-none-any.whl" | sha256sum -c -
          echo "1a8e2620880221eb357056b0fdd65425b026dab222657f54ee202bd75dab987e  r254_wheels/whestbench-0.16.1-py3-none-any.whl" | sha256sum -c -
          sha256sum r254_wheels/* > r254_artifacts/pinned_wheels.sha256
          python -m pip install             r254_wheels/numpy-2.4.6-cp311-cp311-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl             r254_wheels/flopscope-0.12.1-py3-none-any.whl             r254_wheels/whestbench-0.16.1-py3-none-any.whl
          python - <<'PY' > r254_artifacts/runtime_versions.json
          import json, platform
          from importlib.metadata import version
          raw_flop=version("flopscope")
          normalized_flop=raw_flop.split("+",1)[0]
          got={"python":platform.python_version(),"numpy":version("numpy"),
               "flopscope_raw":raw_flop,"flopscope_normalized":normalized_flop,
               "whestbench":version("whestbench")}
          print(json.dumps(got,sort_keys=True))
          if got["python"]!="3.11.16" or got["numpy"]!="2.4.6":
              raise SystemExit(f"core runtime mismatch: {got}")
          if normalized_flop!="0.12.1":
              raise SystemExit(f"flopscope distribution mismatch: {got}")
          if got["whestbench"]!="0.16.1":
              raise SystemExit(f"whestbench distribution mismatch: {got}")
          PY

      - name: Fetch and verify byte-identical pinned V25 parent
        run: |
          set -euo pipefail
          curl --fail --location --retry 3             "https://raw.githubusercontent.com/504aldo/whest-p2-cumulant-k3/18c17e2d7a9aeacd399cfc2c6b571e4e16dbfb45/estimators/estimator_v25.py"             -o r254_artifacts/R254_PARENT_V25.py
          python - <<'PY'
          import hashlib, pathlib
          p=pathlib.Path("r254_artifacts/R254_PARENT_V25.py"); b=p.read_bytes()
          sha=hashlib.sha256(b).hexdigest()
          git=hashlib.sha1(f"blob {len(b)}\0".encode()+b).hexdigest()
          print("sha256",sha); print("git_blob_sha1",git)
          if sha!="c0ae6f12d27d851ddd104dd749ac1f2a6400a6b18a0b4104c389150b93bd4b20":
              raise SystemExit("V25 SHA256 mismatch")
          if git!="195373a110215256b759d7c172ba8c923c62e5cc":
              raise SystemExit("V25 Git blob mismatch")
          PY

      - name: Reconstruct and independently replay frozen fixture
        run: |
          PYTHONPATH=research/r254 python research/r254/r254_fixture.py --out-dir r254_artifacts/fixture             > r254_artifacts/fixture.stdout

      - name: Unchanged parent first, then frozen BPK2K only on parent PASS
        id: targetfree
        shell: bash
        run: |
          set +e
          PYTHONPATH=research/r254 python research/r254/r254_one_shot.py             --parent r254_artifacts/R254_PARENT_V25.py --out-dir r254_artifacts             > r254_artifacts/target_free.stdout 2> r254_artifacts/target_free.stderr
          code=$?
          echo "$code" > r254_artifacts/target_free.exit
          if [ "$code" -eq 0 ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; fi
          exit 0

      - name: Validate candidate only after target-free GO
        id: validate
        if: steps.targetfree.outputs.go == 'true'
        shell: bash
        run: |
          set +e
          whest validate --estimator r254_artifacts/R254_CANDIDATE_SOURCE.py --json             > r254_artifacts/validate.json 2> r254_artifacts/validate.stderr
          code=$?; echo "$code" > r254_artifacts/validate.exit
          if [ "$code" -eq 0 ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; fi
          exit 0

      - name: Verify exact R209 public row network and target hashes
        id: identity
        if: steps.targetfree.outputs.go == 'true' && steps.validate.outputs.go == 'true'
        shell: bash
        run: |
          set +e
          python research/r254/r254_public_identity.py             --r209 research/results/R209-v25-mini100.json             --out r254_artifacts/R254_PUBLIC_IDENTITY.json             > r254_artifacts/public_identity.stdout 2> r254_artifacts/public_identity.stderr
          code=$?; echo "$code" > r254_artifacts/public_identity.exit
          if [ "$code" -eq 0 ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; fi
          exit 0

      - name: Exact public R209 mini-100 candidate run
        id: public
        if: steps.identity.outputs.go == 'true'
        shell: bash
        run: |
          set +e
          whest run             --estimator r254_artifacts/R254_CANDIDATE_SOURCE.py             --dataset hf://aicrowd/arc-whestbench-public-2026@v2-phase2             --split mini --streaming --n-mlps 100 --runner local             --flop-budget 2199023255552 --wall-time-limit 120             --residual-wall-time-limit 0.4 --max-threads 1 --format json             > r254_artifacts/public_report.json 2> r254_artifacts/public.stderr
          code=$?; echo "$code" > r254_artifacts/public.exit
          if [ "$code" -eq 0 ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; fi
          exit 0

      - name: Apply frozen public gates
        if: steps.public.outputs.go == 'true'
        shell: bash
        run: |
          set +e
          python research/r254/r254_public_gate.py             --candidate-report r254_artifacts/public_report.json             --r209 research/results/R209-v25-mini100.json             --identity r254_artifacts/R254_PUBLIC_IDENTITY.json             --out r254_artifacts/R254_PUBLIC_GATE.json             > r254_artifacts/public_gate.stdout 2> r254_artifacts/public_gate.stderr
          echo "$?" > r254_artifacts/public_gate.exit
          exit 0

      - name: Build immutable R254 receipt and file hashes
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path("r254_artifacts");root.mkdir(exist_ok=True)
          def ri(name):
              try:return int((root/name).read_text().strip())
              except:return None
          def rj(name):
              try:return json.loads((root/name).read_text())
              except:return None
          tf=rj("R254_TARGET_FREE_RESULT.json"); ident=rj("R254_PUBLIC_IDENTITY.json"); pg=rj("R254_PUBLIC_GATE.json")
          tfe=ri("target_free.exit"); ve=ri("validate.exit"); ie=ri("public_identity.exit"); pe=ri("public.exit"); pge=ri("public_gate.exit")
          if tf is None: decision="INFRA_ERROR_BEFORE_TARGET_FREE_RESULT"
          elif not tf.get("parent_go",False): decision="INCONCLUSIVE_PARENT_GATE"
          elif not tf.get("candidate_go",False): decision="SCIENTIFIC_REJECT_TARGET_FREE"
          elif ve not in (0,None): decision="SCIENTIFIC_REJECT_VALIDATION"
          elif ie not in (0,None): decision="INCONCLUSIVE_PUBLIC_IDENTITY"
          elif pe not in (0,None): decision="INCONCLUSIVE_PUBLIC_RUN"
          elif pg is not None and pg.get("go"): decision="PUBLIC_DEVELOPMENT_GO"
          elif pg is not None: decision="SCIENTIFIC_REJECT_PUBLIC_GATES"
          else: decision="INFRA_ERROR_AFTER_TARGET_FREE_GO"
          receipt={"schema":"arc.r254.workflow_receipt.v1","job_id":"R254",
            "run_id":"R254-one-shot-global-accuracy-20260923","candidate_id":"V25-BPK2K-BALANCED-CUMULANT-REDUCTION",
            "github_run_id":os.environ.get("GITHUB_RUN_ID"),"github_run_attempt":os.environ.get("GITHUB_RUN_ATTEMPT"),
            "github_sha":os.environ.get("GITHUB_SHA"),"runner_os":os.environ.get("RUNNER_OS"),"image_os":os.environ.get("ImageOS"),
            "target_free_exit":tfe,"validate_exit":ve,"public_identity_exit":ie,"public_exit":pe,"public_gate_exit":pge,
            "decision":decision,"target_free":tf,"public_identity":ident,"public_gate":pg,
            "safety":{"authorized_workflow_count":1,"retry":False,"second_method":False,"paid_or_larger_runner":False,
              "private_or_holdout":False,"submission":False,"leaderboard_or_canonical_edit":False,
              "r223_r244_outputs_or_artifacts":False,"r252_workflow_edit":False}}
          (root/"R254_WORKFLOW_RECEIPT.json").write_text(json.dumps(receipt,indent=2,sort_keys=True,allow_nan=False)+"\n")
          hashes={}
          for p in sorted(root.rglob("*")):
              if p.is_file() and p.name!="R254_ARTIFACT_HASHES.json":
                  hashes[str(p.relative_to(root))]=hashlib.sha256(p.read_bytes()).hexdigest()
          (root/"R254_ARTIFACT_HASHES.json").write_text(json.dumps(hashes,indent=2,sort_keys=True)+"\n")
          print(json.dumps({"decision":decision,"hashes":hashes},indent=2,sort_keys=True))
          PY

      - name: Upload sole R254 evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r254-one-shot-evidence
          path: r254_artifacts/
          if-no-files-found: error

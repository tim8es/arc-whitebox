name: e014-batched-strassen-joiner

on:
  push:
    branches:
      - research/e014-batched-strassen-joiner
  workflow_dispatch:

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned project stack and focused tools
        run: python -m pip install -e . pytest ruff
      - name: Lint E014 test
        run: ruff check --ignore I001 tests/test_e014_patch.py
      - name: Focused E014 tests
        run: pytest -q tests/test_e014_patch.py

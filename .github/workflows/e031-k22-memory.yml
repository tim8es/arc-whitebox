name: E031 K22 memory preflight

on:
  push:
    branches:
      - research/e031-k22-memory-preflight-20260915
    paths:
      - 'tests/test_e031_k22_memory.py'
      - 'methods/e031_k22_memory.py'
      - 'scripts/run_e031_k22_memory.py'
      - '.github/workflows/e031-k22-memory.yml'

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install -e . pytest
      - name: Focused E031 tests
        run: pytest -q tests/test_e031_k22_memory.py

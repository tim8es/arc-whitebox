name: E095 focused RED-GREEN

on:
  push:
    branches:
      - research/e095-output-subspace-residual-sampling-20260917
    paths:
      - "tests/test_e095_output_subspace_sampling.py"
      - "methods/e095_output_subspace_sampling.py"
      - ".github/workflows/e095-red-green.yml"

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        run: python -m pip install -e . pytest
      - name: Run E095 focused tests
        run: python -m pytest -q tests/test_e095_output_subspace_sampling.py

name: E100 frozen Stage-A

on:
  push:
    branches:
      - research/e100-orthogonal-gaussian-antithetic-20260918
    paths:
      - 'research/E100_PROTOCOL.md'
      - 'scripts/e100_orthogonal_gaussian_antithetic.py'
      - '.github/workflows/e100-stage-a.yml'

jobs:
  frozen:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen NumPy
        run: python -m pip install numpy==2.4.6
      - name: Exactly one frozen E100 Stage-A falsifier
        run: python scripts/e100_orthogonal_gaussian_antithetic.py
      - name: Upload immutable E100 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e100-stage-a
          path: e100-stage-a.json
          if-no-files-found: error
          retention-days: 90

name: e012-batched-joiner-feasibility

on:
  push:
    branches: [research/e012-batched-joiner-transforms]
  workflow_dispatch:

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and focused tools
        run: python -m pip install -e . ruff pytest
      - name: Lint E012 test
        run: ruff check tests/test_e012_batched_joiner.py
      - name: Focused E012 tests
        run: pytest -q tests/test_e012_batched_joiner.py

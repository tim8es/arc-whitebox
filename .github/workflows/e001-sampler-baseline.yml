name: e001-sampler-baseline

on:
  pull_request:
    branches:
      - research/bootstrap
    paths:
      - .github/workflows/e001-sampler-baseline.yml
      - research/e001-sampler-baseline-trigger.txt

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: python -m pip install -e .

      - name: Validate whitened-antithetic estimator
        run: whest validate --estimator methods/whitened_antithetic.py

      - name: Score whitened-antithetic estimator on Phase 2 mini
        run: |
          whest run --estimator methods/whitened_antithetic.py \
            --dataset hf://aicrowd/arc-whestbench-public-2026@v2-phase2 \
            --split mini \
            --runner local

name: E109 sole frozen production-shape verifier

on:
  push:
    branches:
      - research/e109-late-gatepair-sign-cv-20260919
    paths:
      - "scripts/e109_late_gatepair_sign_cv.py"
      - ".github/workflows/e109-production.yml"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frozen project dependencies
        run: python -m pip install -e . pytest
      - name: Recheck focused GREEN
        run: python -m pytest -q tests/test_e109_late_gatepair_sign_cv.py
      - name: Run sole frozen E109 verifier
        shell: bash
        run: |
          set +e
          python scripts/e109_late_gatepair_sign_cv.py 2>&1 | tee e109-late-gatepair-sign-cv.log
          status=${PIPESTATUS[0]}
          if [ ! -f e109-exit.txt ]; then echo "${status}" > e109-exit.txt; fi
          exit 0
      - name: Upload immutable E109 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e109-late-gatepair-sign-cv
          path: |
            e109-late-gatepair-sign-cv.json
            e109-late-gatepair-sign-cv.log
            e109-exit.txt
          if-no-files-found: error
          retention-days: 90
      - name: Enforce frozen scientific terminal
        if: always()
        shell: bash
        run: |
          status=$(cat e109-exit.txt)
          exit "${status}"

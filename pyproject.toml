[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arc-whitebox-research"
version = "0.1.0"
description = "Research harness for ARC White-Box Estimation Challenge 2026 Phase 2"
requires-python = ">=3.10"
dependencies = [
    "flopscope>=0.12.1,<0.13.0",
    "whestbench>=0.16.1,<0.17.0",
    "numpy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.6.0",
]

[tool.setuptools]
py-modules = ["estimator"]

[tool.setuptools.packages.find]
include = ["methods*", "baselines*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
